<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supabase Debug Test</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        #testBtn {
            background: #2563eb;
            color: white;
        }

        #saveBtn {
            background: #16a34a;
            color: white;
        }

        #refreshBtn {
            background: #64748b;
            color: white;
        }

        #debug {
            background: #111827;
            color: #22c55e;
            padding: 15px;
            margin-top: 20px;
            min-height: 300px;
            white-space: pre-wrap;
            font-family: Consolas, monospace;
            overflow: auto;
        }

        .status {
            padding: 15px;
            margin-top: 15px;
            background: #f8fafc;
            border: 1px solid #ddd;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Supabase Debug Test</h1>

    <div>

        <button id="testBtn">
            🔍 ทดสอบการเชื่อมต่อ
        </button>

        <button id="saveBtn">
            💾 ทดสอบบันทึก
        </button>

        <button id="refreshBtn">
            📋 โหลดข้อมูล
        </button>

    </div>


    <div class="status">

        <strong>สถานะ:</strong>

        <div id="output">
            ยังไม่ได้ทดสอบ
        </div>

    </div>


    <h3>Debug Log</h3>

    <div id="debug">
รอการทดสอบ...
    </div>

</div>


<script src="script.js"></script>

</body>

</html>
